<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Free Student Union DMC</title>
    <link rel="icon" href="/path-to-logo/favicon.ico" sizes="640x640" />
    <link rel="icon" type="image/png" sizes="640x640" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="640x640" href="/logo.png" />
    <!-- Single Page App Redirect Script for GitHub Pages & Static Hosts -->
    <script type="text/javascript">
      // Intercept 404 and redirect into single page app with path preserved
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(newUrl);
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 36px 28px;
        max-width: 480px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      h1 {
        color: #b91c1c;
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        color: #475569;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting to Free Student Union DMC...</h1>
      <p>Please wait while we locate your requested page or navigate you to the campus portal.</p>
      <a href="/">Go to Home</a>
    </div>
  </body>
</html>
